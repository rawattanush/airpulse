  # ------------------------------------------------------------------ aviation operations layer (experimental)
  - id: hkia
    layer: aviation
    name: Hong Kong International Airport flight information
    url: https://www.hongkongairport.com/flightinfo-rest/rest/flights/past
    type: flight operations
    frequency: every flight of each day; the day before is complete each morning
    check_every_days: 1
    stale_after_days: 3
    data_stale_after_days: 3
    active: true
    production: false
    license: DATA.GOV.HK terms. Commercial and non-commercial use free of charge with the source identified.
    coverage: Hong Kong only; about 90 days back; cargo flights listed apart
    feeds: [air traffic]
    notes: latest_data is the newest day archived. The publisher keeps about 90 days, so a gap longer than that cannot be refilled.
  - id: eurocontrol
    layer: aviation
    name: European airports, daily movements (EUROCONTROL)
    url: https://www.eurocontrol.int/performance/data/download/csv/
    type: airport movement counts
    frequency: a month is added about three weeks after it ends
    check_every_days: 7
    stale_after_days: 14
    data_stale_after_days: 75
    active: false
    production: false
    license: Published for information. Reuse with the source named and NOT for commercial purposes; written permission needed otherwise.
    coverage: 380 airports, daily, 2016 onward
    feeds: []
    notes: Never exported (production policy, CL-019). Collected as research.
  - id: usdot
    layer: aviation
    name: US international nonstop departures (US DOT)
    url: https://data.transportation.gov/api/views/innc-gbgc
    type: flight operations, monthly counts
    frequency: irregular; about eight months behind the month described
    check_every_days: 7
    stale_after_days: 14
    data_stale_after_days: 365
    active: true
    production: false
    license: Public Domain U.S. Government
    coverage: every US-foreign airport pair by carrier, monthly, 1990 onward
    feeds: [air traffic, route page]
    notes: The file is downloaded only when the portal reports that its rows changed.
  - id: positions
    layer: aviation
    name: Aircraft positions near airports (adsb.lol)
    url: https://api.adsb.lol/v2/point
    type: position picture
    frequency: one picture per run
    check_every_days: 1
    stale_after_days: 3
    active: false
    production: false
    license: Open Database License (ODbL) 1.0, with attribution
    coverage: uneven; thin outside Europe and North America; rate limited
    feeds: []
    notes: Switched off (CL-019). About half of the airports answer and nothing derived from it is validated; it is not part of the product.

