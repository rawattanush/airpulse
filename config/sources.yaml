  - {id: bls_IS2312, layer: core, name: "US → Asia air freight price index, every release (BLS IS2312)", url: "https://www.bls.gov/bls/news-release/ximpim.htm", type: price index with revision history, frequency: monthly release (mid-month), check_every_days: 19, stale_after_days: 28.5, data_stale_after_days: 45, active: true, production: true, license: "U.S. Bureau of Labor Statistics, read at the Bureau itself; public domain; cite the Bureau", coverage: "monthly, one column per release of the Bureau", feeds: [market], notes: Shown as an index; no outlook.}
