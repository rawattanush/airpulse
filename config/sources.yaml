    check_every_days: 7
    stale_after_days: 14
    data_stale_after_days: 14
    active: true
    production: true
    license: U.S. Energy Information Administration, read at the Administration itself; acknowledge the source with the date. Reuse of the spot prices is awaiting the Administration's confirmation (production policy)
    coverage: daily spot price, 1987-05 onward
    feeds: [market drivers]
    notes: Context only.
  - {id: bls_IC1312, layer: core, name: "Asia → US air freight price index, every release (BLS IC1312)", url: "https://www.bls.gov/bls/news-release/ximpim.htm", type: price index with revision history, frequency: monthly release (mid-month), check_every_days: 19, stale_after_days: 28.5, data_stale_after_days: 45, active: true, production: true, license: "U.S. Bureau of Labor Statistics, read at the Bureau itself; public domain; cite the Bureau", coverage: "monthly, one column per release of the Bureau", feeds: [monthly outlook, market, history, replay], notes: The validated target. latest_data is the date of the newest release held.}
