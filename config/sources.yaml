    type: headline metadata
    frequency: working days
    check_every_days: 1
    stale_after_days: 3
    data_stale_after_days: 7
    active: false
    production: false
    license: Publisher's copyright. Only the headline, its date and its link are stored and shown; no article text.
    coverage: one trade publication
    feeds: []
    notes: Experimental event layer. Not an input of any forecast. Terms as read on 2026-10-03, robots.txt does not disallow the interface; no terms page was found.
  - id: news_splash247
    layer: core
    name: Splash247 headlines
    url: https://splash247.com/wp-json/wp/v2/posts
    type: headline metadata
    frequency: working days
    check_every_days: 1
    stale_after_days: 3
    data_stale_after_days: 7
    active: false
    production: false
    license: Publisher's copyright. Only the headline, its date and its link are stored and shown; no article text.
    coverage: one trade publication
    feeds: []
