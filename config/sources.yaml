# AirPulse source declarations. CONFIGURATION, maintained by hand: what each source is, where it is, how often it is
# expected to publish, when it counts as stale, and what its terms allow.
#
# This file holds no state. The state of every source (last attempt, last success, newest data, status, error) is
# computed from the run logs and the clock by src/observability/registry.py and written to operations/sources.yaml,
# which is GENERATED and must never be edited. The customer application reads only the generated registry.
#
#   python -m src.observability.registry            # write operations/sources.yaml and print the table
#   python -m src.observability.registry --check    # declarations consistent with the pipeline's own source table
#
# status (generated): HEALTHY | STALE | DEGRADED | FAILED | DISABLED | RESEARCH_ONLY
#   DISABLED        active: false
#   RESEARCH_ONLY   type: research (held for study, never fetched by a pipeline, never shown as current)
#   FAILED          no successful run on record, or the newest attempt failed and the last success is older than stale_after_days
#   DEGRADED        the newest attempt failed, was partial or was rate limited; the data held are still within stale_after_days
#   STALE           nothing has checked the source for stale_after_days, or its newest data are older than data_stale_after_days
#   HEALTHY         otherwise
version: 1

layers:   # where each layer writes its run records and how to read them
  core:     {log: operations/ingestion_log.jsonl,          time: retrieved_at, latest: [latest_observation], success: [UPDATED, UNCHANGED, SEEDED],          partial: []}
  aviation: {log: operations/aviation/ingestion_log.jsonl, time: fetched_at,   latest: [latest_observation, day], success: [NEW, REVISED, UNCHANGED, OK, SEEDED], partial: [PARTIAL, RATE_LIMITED]}

sources:
  # ------------------------------------------------------------------ forecast inputs (monthly outlook)
  - id: eia_jet_fuel
    layer: core
    name: US Gulf Coast jet fuel (EIA)
    url: https://www.eia.gov/dnav/pet/hist_xls/EER_EPJK_PF4_RGC_DPGd.xls
    type: price series
    frequency: daily prices, published once a week
    check_every_days: 7
    stale_after_days: 14
    data_stale_after_days: 14
    active: true
    production: true
    license: U.S. Energy Information Administration, read at the Administration itself; acknowledge the source with the date. Reuse of the spot prices is awaiting the Administration's confirmation (production policy)
    coverage: daily spot price, 1990-04 onward
    feeds: [monthly outlook context, market drivers]
    notes: Context of the monthly outlook. The official forecast (the seasonal record) does not use it; the two evaluated models do. Every spreadsheet fetched is kept with its date.
  - id: eia_brent
    layer: core
    name: Brent crude (EIA)
