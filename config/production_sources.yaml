# AirPulse production policy. Which sources and which features may reach the public product.
#
# The export of the customer application reads this file (src/observability/policy.py) and REFUSES to publish
#   - a source whose license_class is UNKNOWN, NON-COMMERCIAL, RESEARCH-ONLY, LICENSE-REQUIRED or BLOCKED,
#   - a source with commercial_allowed, public_display_allowed or derived_data_allowed false, or not enabled,
#   - a source whose production_status is not PRODUCTION,
#   - a feature whose status is not PRODUCTION READY, or one of whose sources is refused.
# Nothing here is state: last fetch, newest data and health are computed (operations/sources.yaml).
# A licence class is a reading of the publisher's own terms on the date given, with the sentence it rests on. It is not legal advice.
#
# license_class: COMMERCIAL-SAFE | COMMERCIAL-SAFE-WITH-ATTRIBUTION | COMMERCIAL-SAFE-WITH-LIMITS | NON-COMMERCIAL |
#                RESEARCH-ONLY | LICENSE-REQUIRED | UNKNOWN | BLOCKED
# production_status: PRODUCTION | RESEARCH (collected, never published) | DISABLED | BLOCKED
# licence_status (one word for every source, CL-024):
#   CLEARED               every right the product uses is stated in the publisher's own terms, read on evidence_date
#   PENDING_CONFIRMATION  a named question to the publisher is open (field `pending`). The source may be built into the hosted folder; nothing is deployed while it is pending
#   RESEARCH_ONLY         held for research, never published
#   RETIRED               no longer read (see `retired` at the end of this file)
#   NOT_CONNECTED         declared so that the gap is visible; never read
# feature status:    PRODUCTION READY | BLOCKED | NEEDS VALIDATION | NEEDS LICENCE | REMOVE FROM PUBLIC PRODUCT
version: 1
audited: "2026-10-07"

