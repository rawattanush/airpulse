    limits: "CLEARED BY THE OWNER'S DECISION of 2026-10-08, not by a confirmation of the Administration (change record CL-027). The Administration's reuse page allows use and distribution with an acknowledgment; its spot price tables name a commercial data vendor (Refinitiv, of LSEG) as their source, and whether these prices are protected material was not asked: the drafted question was not sent. The owner accepts that open point and removes the fuel prices from the product if the Administration or the vendor objects."
    evidence: "Reuse page of the Administration: U.S. government publications are in the public domain; its data, files and databases may be used and distributed; an acknowledgment with the date is asked for. The definitions page of the spot price tables names Refinitiv, an LSEG business, as the source. The files are served without a key."
