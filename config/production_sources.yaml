    attribution: "Source: U.S. Bureau of Labor Statistics, Import and Export Price Indexes, retrieved from BLS.gov on the date shown. BLS.gov cannot vouch for the data or analyses derived from these data after the data have been retrieved from BLS.gov."
    evidence: "The Bureau's copyright page: everything it publishes is in the public domain, free to use without specific permission, with the Bureau cited. Terms of its public data interface: cite the date of retrieval and state that the Bureau cannot vouch for later analyses. Its robot policy forbids excessive automated retrieval and asks that a robot can be traced to its owner: one request at a time, a named client. Version 1 of the interface needs no key (25 queries a day)."
    evidence_url: "https://www.bls.gov/bls/linksite.htm ; https://www.bls.gov/developers/termsOfService.htm ; https://www.bls.gov/bls/blsterms.htm"
    evidence_date: "2026-10-07"
