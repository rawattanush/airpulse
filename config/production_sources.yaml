features:
  # ---------------------------------------------------------------- in the public product
  - {id: market_index, name: Air-freight price index by lane, kind: observation, status: PRODUCTION READY, sources: [bls_IC1312, bls_IC1311, bls_IC131, bls_IS2311, bls_IS2312, bls_IS231, bls_IV131, bls_IV1311], artifacts: ["core.lanes", "market/<lane>.json"], pages: [Overview, Market, Trends, History, Lanes], validation: "values equal the publisher's vintages; release calendar and labels by the validated ingestion code (tests T-01 to T-05; data contracts)", wording: "an index level, never a price or a rate"}
  - {id: monthly_outlook, name: "Monthly outlook for the validated index, its record and its replay", kind: prediction, status: PRODUCTION READY, sources: [bls_IC1312], artifacts: ["outlook.forecasts", "outlook.record", "outlook.current", "outlook.operational", "outlook.selection", "outlook.reliability", "replay.json"], pages: [Overview, Market, Monthly outlook, History, Replay], validation: "walk-forward evaluation on 123 scored months; the official forecaster is the one the selection rule names; leakage audit; three later pre-registered experiments named no replacement", wording: "an outlook with its probability and its record; a proxy index, not a lane rate"}
  - {id: fuel_prices, name: Jet fuel and crude oil prices and market context, kind: observation, status: PRODUCTION READY, sources: [eia_jet_fuel, eia_brent, bls_IC1312], artifacts: ["core.fuel", "replay.months[].signals"], pages: [Overview, Fuel and context], validation: "validated ingestion code; adapters refuse disordered, duplicated, non-positive, truncated or future-dated values (ops tests; PR-T05)", wording: "published prices and arithmetic on them"}
  - {id: hong_kong_airport_activity, name: Hong Kong airport activity (observed), kind: observation, status: PRODUCTION READY, sources: [hkia], artifacts: ["aviation.airport"], pages: [Air traffic], validation: "official flight information; four lists per day archived with checksums; record validators and quality gate (AO-T03, AO-T05, AO-T12, PR-T10)", wording: "counts of flights; no expected level, no anomaly, no capacity, no cause, no price"}
  - {id: us_route_departures, name: US international departures by route (observed), kind: observation, status: PRODUCTION READY, sources: [usdot], artifacts: ["aviation.routes"], pages: [Air traffic, Route], validation: "official monthly counts; file refused unless columns, months and totals are consistent (PR-T09)", wording: "monthly counts as published, about eight months old; historical, never current"}
  - {id: scenario_calculator, name: Scenario calculator, kind: tool, status: PRODUCTION READY, sources: [], artifacts: [], pages: [Estimate], validation: "arithmetic on the user's own numbers (web tests of scenario.js)", wording: "a scenario of the user's numbers; no route rate"}
  - {id: data_status, name: Data state and run status, kind: observation, status: PRODUCTION READY, sources: [], artifacts: ["core.registry", "core.status", "core.schedule", "core.export"], pages: [Data], validation: "computed from append-only run records and the clock; recomputed in the browser (PR-T02 to PR-T04; web tests)", wording: "states, with their reasons"}

  # ---------------------------------------------------------------- removed from the public product
  - {id: weekly_fuel_outlook, name: Weekly fuel-cost outlook, kind: prediction, status: NEEDS LICENCE, sources: [], reason: "Its weekly release windows, its fitted rule and its record were built on dated vintages of the fuel prices that only one relay service holds, and that service's terms forbid keeping the data and building models on them without its consent. The Energy Information Administration publishes no dated vintages from which they could be rebuilt. The outlook returns when it can be rerun on releases the deployed system has archived itself, or with that consent. Kept as research."}
  - {id: news_adjusted_outlook, name: "News-adjusted outlook (experimental)", kind: prediction, status: PRODUCTION READY, sources: [press_aircargoweek, press_splash247, bls_IC1312], artifacts: ["news.json"], pages: [News-adjusted outlook], validation: "protocol 7.0, pre-registered: walk-forward on 63 months against the seasonal baseline and against the same model without news; news did not add value by the rule fixed in advance", wording: "experimental; shown beside the official outlook, never as it; its record is shown with it; events are summaries with links, not headlines", reason: "Shown beside the official outlook, never in its place, with the result of its pre-registered test (protocol 7.0): it did not improve on the seasonal baseline. Published as an experiment on the owner's decision."}
  - {id: event_intelligence, name: "Reported events, briefing and themes from the trade press", kind: observation, status: REMOVE FROM PUBLIC PRODUCT, sources: [news_aircargoweek, news_splash247], reason: "Two conditions fail. The right to display the publishers' headlines is not established (licence class UNKNOWN). The event extraction is not validated: it was checked only against a reference annotation whose annotator is not recorded. Kept as research in the repository and the Control Center."}
  - {id: european_airport_activity, name: European airport activity, kind: observation, status: NEEDS LICENCE, sources: [eurocontrol], reason: "The publisher forbids commercial use. Removed from the public product; it returns only with EUROCONTROL's written permission. Kept as research."}
  - {id: airport_anomaly_reading, name: "Expected activity, difference, reading and flags of unusual activity", kind: anomaly, status: REMOVE FROM PUBLIC PRODUCT, sources: [hkia, eurocontrol], reason: "Its validation events are now independently evidenced (data/reference/disruption_events.csv: 15 of 15), and it finds all of them, but it flags 7.1% of ordinary airport-days against the 5% allowed by the rule fixed before the test (protocol 4.0). The detector was not changed to pass. Not promoted; removed."}
  - {id: capacity_proxy, name: Capacity proxy, kind: capacity, status: REMOVE FROM PUBLIC PRODUCT, sources: [flight_lists_2019_2022], reason: "No scheme tracks official cargo tonnes, and aircraft types exist in research-licensed data only. No capacity statement is made anywhere in the product."}
  - {id: corridor_activity_index, name: Corridor index against its expected level, kind: anomaly, status: REMOVE FROM PUBLIC PRODUCT, sources: [usdot], reason: "A derived index with an expected level from three reference values; never validated. The observed route counts it was built from stay (us_route_departures)."}
  - {id: aircraft_positions_picture, name: Aircraft seen near airports, kind: live, status: REMOVE FROM PUBLIC PRODUCT, sources: [positions], reason: "About half of the airports answer; nothing derived from it is validated. The source is switched off and the word live is not used."}
  - {id: research_results_on_pages, name: "Results of experiments on customer pages (data groups, second pass, the alternative being watched, the air-traffic ablation, the fuel carry-forward table)", kind: research, status: REMOVE FROM PUBLIC PRODUCT, sources: [], reason: "Research metrics. They stay in research/ and evaluation/; the Methodology says in words what was tested and what it means for the product."}
