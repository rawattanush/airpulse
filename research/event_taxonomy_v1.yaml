# AirPulse event taxonomy, version 1.0 (2026-10-04).
# Read by src/news/taxonomy.py. Changing a pattern, a type or an effect requires a new taxonomy_version
# (and therefore a new file event_taxonomy_v<N>.yaml); events store the version that produced them.
#
# Matching is on a normalised headline (lower case, plain ASCII punctuation). Every pattern is a Python
# regular expression. `conf` is the base extraction confidence of that pattern (how specific it is).
# Context handling (negation, reversal, hypothetical, retrospective) is generic and lives in `context` below.
#
# Fields of an event type:
#   category          parent category
#   feature_group     which aggregate feature the type feeds (see research/event_feature_definitions.md)
#   direction         +1 or -1: sign of the type inside its feature group
#   base_severity     1 (minor) .. 3 (major); cue words move it by one step
#   affected_mode     AIR | SEA | MULTI
#   effects           capacity / demand / supply / diversion_pressure: INCREASE | DECREASE | UNKNOWN
#   reversible        true: a reversal cue ("lifted", "reopened") turns the match into status ENDED
#   requires_mode     AIR: only emitted if the headline has an air cue or the source's default mode is AIR
#   excludes          optional regex: if it matches the headline the type is rejected (reason EXCLUDED)
#   patterns          list of {re, conf}

taxonomy_version: "1.0"

statuses:
  ACTIVE: confirmed as happening or having happened
  POTENTIAL: warned of, threatened, planned, expected or asked as a question
  ENDED: the headline reports the end or easing of the condition

categories:
  GEOPOLITICAL: armed conflict, sanctions and diplomatic ruptures
  MARITIME: disruption of sea lanes, chokepoints and ports
  AVIATION: airspace, flights and aircraft capacity
  AIR_CARGO: air freight rates, demand and market capacity
  FUEL: crude oil, jet fuel and fuel surcharges
  TRADE: trade restrictions and trade flows

context:
  # a cue must occur within `window_tokens` tokens before the trigger (negation) or anywhere in the clause (others)
  negation:
    window_tokens: 4
    re: '\b(no|not|never|without|denies|denied|deny|dismiss(es|ed)?|rules? out|ruled out|unlikely|won''t|will not|did not|didn''t|does not|doesn''t|fails? to|failed to|avert(s|ed)?|avoid(s|ed)? (a|an)|unaffected)\b'
  reversal:
    re: '\b(lift(s|ed|ing)?|reopen(s|ed|ing)?|re-open(s|ed|ing)?|resum(e|es|ed|ing|ption)|restor(e|es|ed|ing)|eas(e|es|ed|ing)|an end to|ends|ended|is over|clear(s|ed|ing)?|normalis\w+|normaliz\w+|back to normal|returns? to normal|called off|calls off|averted|subsid(e|es|ed|ing))\b'
  hypothetical:
    re: '\b(could|may|might|would|warn(s|ed|ing|ings)?|threat(s|en|ens|ened|ening)?|risks?|fear(s|ed)?|expect(s|ed|ing)?|forecast(s|ed)?|predict(s|ed)?|plan(s|ned|ning)? to|consider(s|ed|ing)?|possible|potential(ly)?|likely|loom(s|ing)?|brac(e|es|ed|ing) for|if|set to|poised to|mull(s|ed|ing)?|talks?|propos(al|es|ed)|outlook|scenario|prospect(s)?|call(s|ed)? for|urge(s|d)?|vow(s|ed)?|prepar(e|es|ed|ing) (for|to))\b|\?\s*$'
  retrospective:
    re: '\b(\d+ years? (on|after|since|ago)|a year (on|after|since|ago)|anniversary|lessons (from|learned|learnt)|looking back|in review|year in review|recap|remember(s|ed|ing)?|history of)\b'
  contrast:
    re: '\b(but|while|whilst|despite|although|though|yet|whereas)\b'
  air_cue:
    re: '\b(air ?cargo|air ?freight|airfreight|freighters?|airlines?|aviation|flights?|bellyhold|belly capacity|iata|airports?|aircraft|air)\b'
  intensifier:
    re: '\b(major|massive|severe(ly)?|record|unprecedented|total|complete(ly)?|indefinite(ly)?|widespread|crisis|chaos|collaps\w+|soar\w*|plung\w+|surg\w+|slump\w*|skyrocket\w*|crash\w*|all-time|historic|worst|sharp(ly)?|steep(ly)?|huge)\b'
  downtoner:
    re: '\b(minor|brief(ly)?|partial(ly)?|slight(ly)?|temporar(y|ily)|limited|small|modest(ly)?|marginal(ly)?|some|short-lived)\b'
  duration_long:
    re: '\b(indefinite(ly)?|until further notice|prolonged|long-term|months?-long|for months)\b'
  duration_short:
    re: '\b(temporar(y|ily)|brief(ly)?|short-lived|for hours|hours-long|overnight|24-hour|48-hour|one-day)\b'

# shared fragments, expanded by the loader: {UP}, {DOWN}
fragments:
  UP: '(ris(e|es|ing)|rose|surg\w+|soar\w*|jump\w*|climb\w*|spik\w+|increas\w+|higher|rebound\w*|strengthen\w*|firm(s|ed|er|ing)?|rall(y|ies|ied)|gain(s|ed)?|skyrocket\w*|go(es)? up|goes up|up \d|hits? (a |an )?(\w+ )?(high|record)|heats? up)'
  DOWN: '(fall(s|ing)?|fell|drop(s|ped|ping)?|declin\w+|slid(e|es|ing)?|slump\w*|plung\w+|soften\w*|weak(en|ens|ened|ening|er)?|lower|dip(s|ped)?|tumbl\w+|sink(s|ing)?|sank|crash\w*|collaps\w+|retreat\w*|down \d|hits? (a |an )?(\w+ )?low|cool(s|ed|ing)?)'

event_types:

  # ------------------------------------------------------------------ GEOPOLITICAL
  WAR_ESCALATION:
    category: GEOPOLITICAL
    feature_group: geopolitical_shock
    direction: 1
    base_severity: 3
    affected_mode: MULTI
    reversible: true
    effects: {capacity: DECREASE, demand: UNKNOWN, supply: DECREASE, diversion_pressure: INCREASE}
    patterns:
      - {re: '\b(war|conflict|hostilities|fighting)\b.{0,40}\b(escalat\w+|intensif\w+|widen\w+|spreads?|erupts?|breaks? out|broke out|flares?)\b', conf: 0.85}
      - {re: '\b(escalation|outbreak) (of|in) (the )?(war|conflict|hostilities|fighting)\b', conf: 0.85}
      - {re: '\b(declares?|declared) war\b', conf: 0.9}
      - {re: '\binva(des?|ded|sion of)\b', conf: 0.8}
  MILITARY_ATTACK:
    category: GEOPOLITICAL
    excludes: '\b(workers?|dockers?|unions?|labou?r|walk ?outs?|industrial action|pay (deal|dispute|talks)|wages?|cyber\w*|hack\w*|ransomware|malware|virus|covid\w*|heart attack|lightning|shark|storms?|typhoon|hurricane|cyclone|investors?|shareholders?|analysts?|critics?|lawsuit|court|fine[ds]?|debts?|creditors?|banks?|arrest(s|ed)?)\b'
    feature_group: geopolitical_shock
    direction: 1
    base_severity: 2
    affected_mode: MULTI
    reversible: false
    effects: {capacity: UNKNOWN, demand: UNKNOWN, supply: DECREASE, diversion_pressure: INCREASE}
    patterns:
      - {re: '\b(missiles?|drones?|rockets?|air ?strikes?|torpedo(es)?|limpet mines?)\b.{0,40}\b(attack(s|ed)?|strikes?|struck|hits?|fired|target(s|ed)?)\b', conf: 0.85}
      - {re: '\b(ship|vessel|tanker|bulker|boxship|containership|carrier|freighter)s?\b.{0,30}\b(attacked|(struck|hit) by (a |an |two |three |several )?(missiles?|drones?|rockets?|torpedo(es)?|mines?|projectiles?|gunfire|shells?|explosions?|blasts?)|seized by|hijacked|fired (on|upon))\b', conf: 0.85}
      - {re: '\b(attack(s|ed)?|struck|seiz(es|ed|ure of)|hijack(s|ed|ing)?|bomb(s|ed|ing)?|shell(s|ed|ing))\b.{0,30}\b(ship|vessel|tanker|bulker|boxship|containership|port|airport|refinery|pipeline)s?\b', conf: 0.8}
  SANCTIONS:
    category: GEOPOLITICAL
    excludes: '\b(projects?|developments?|oilfields?|fields?|fid|investments?|antitrust|competition|newbuild\w*|expansion)\b'
    feature_group: geopolitical_shock
    direction: 1
    base_severity: 2
    affected_mode: MULTI
    reversible: true
    effects: {capacity: UNKNOWN, demand: DECREASE, supply: DECREASE, diversion_pressure: UNKNOWN}
    patterns:
      - {re: '\bsanctions (on|against|list|regime|relief|hit|bite|target\w*|remain|loom|threat)\b|\b(us|u\.s\.|eu|un|uk|western|international|economic|trade|new|fresh|more|further|tighter|tougher|iran\w*|russia\w*|korea\w*|venezuela\w*)\s+sanctions\b|\b(hit|slapped|targeted) (by|with) (\w+ ){0,2}sanctions\b|\bembargo(es)?\b|\bblacklist(s|ed)?\b', conf: 0.8}
  CEASEFIRE:
    category: GEOPOLITICAL
    feature_group: geopolitical_shock
    direction: -1
    base_severity: 2
    affected_mode: MULTI
    reversible: false
    effects: {capacity: INCREASE, demand: UNKNOWN, supply: INCREASE, diversion_pressure: DECREASE}
    patterns:
      - {re: '\b(ceasefire|cease-fire|truce|armistice|peace (deal|agreement|accord|treaty))\b', conf: 0.85}
  DIPLOMATIC_ESCALATION:
    category: GEOPOLITICAL
    feature_group: geopolitical_shock
    direction: 1
    base_severity: 1
    affected_mode: MULTI
    reversible: true
    effects: {capacity: UNKNOWN, demand: UNKNOWN, supply: UNKNOWN, diversion_pressure: UNKNOWN}
    patterns:
      - {re: '\b(expels?|expelled|recalls?|recalled) (its |their )?(ambassadors?|diplomats?|envoys?)\b', conf: 0.85}
      - {re: '\b(severs?|severed|cuts?|suspends?|suspended|breaks? off) (all )?(diplomatic )?(ties|relations)\b', conf: 0.85}
      - {re: '\bultimatum\b', conf: 0.7}

  # ------------------------------------------------------------------ MARITIME
  SUEZ_DISRUPTION:
    category: MARITIME
    feature_group: maritime_disruption
    direction: 1
    base_severity: 3
    affected_mode: SEA
    reversible: true
    effects: {capacity: DECREASE, demand: UNKNOWN, supply: DECREASE, diversion_pressure: INCREASE}
    patterns:
      - {re: '\bsuez\b.{0,60}\b(block(s|ed|age)?|clos(ed|ure|es|ing)|ground(s|ed|ing)|stuck|suspend\w*|halt\w*|disrupt\w*|shut|jam(s|med)?|avoid\w*|divert\w*|paus\w+)\b', conf: 0.9}
      - {re: '\b(block(s|ed|age|ing)?|clos(ed|ure|es|ing)|ground(s|ed|ing)|suspend\w*|halt\w*|disrupt\w*|avoid\w*|shun\w*)\b.{0,40}\bsuez\b', conf: 0.9}
      - {re: '\bsuez\b.{0,50}\b(reopen(s|ed|ing)?|re-open(s|ed|ing)?|refloat(s|ed)?|freed|resum(e|es|ed|ption)|clear(s|ed))\b', conf: 0.9}
  RED_SEA_DISRUPTION:
    category: MARITIME
    feature_group: maritime_disruption
    direction: 1
    base_severity: 3
    affected_mode: SEA
    reversible: true
    effects: {capacity: DECREASE, demand: UNKNOWN, supply: DECREASE, diversion_pressure: INCREASE}
    patterns:
      - {re: '\b(red sea|bab[- ]el[- ]mandeb|gulf of aden)\b.{0,60}\b(attack\w*|disrupt\w*|crisis|avoid\w*|divert\w*|rerout\w*|re-rout\w*|suspend\w*|halt\w*|paus\w+|strikes?|struck|hit|turmoil|chaos|diversions?|transits? (halt|suspend|paus)\w*)\b', conf: 0.9}
      - {re: '\b(attack\w*|disrupt\w*|crisis|avoid\w*|divert\w*|rerout\w*|suspend\w*|halt\w*|paus\w+|shun\w*)\b.{0,40}\b(red sea|bab[- ]el[- ]mandeb|gulf of aden)\b', conf: 0.9}
      - {re: '\bhouthis?\b.{0,40}\b(attack\w*|strikes?|struck|hit|hits|target\w*|missiles?|seiz\w+|hijack\w*|sink|sank|sunk)\b', conf: 0.85}
  HORMUZ_DISRUPTION:
    category: MARITIME
    feature_group: maritime_disruption
    direction: 1
    base_severity: 3
    affected_mode: SEA
    reversible: true
    effects: {capacity: DECREASE, demand: UNKNOWN, supply: DECREASE, diversion_pressure: INCREASE}
    patterns:
      - {re: '\bhormuz\b.{0,60}\b(clos\w+|block\w*|disrupt\w*|attack\w*|seiz\w+|halt\w*|suspend\w*|mines?|shut|standstill|paralys\w+|collaps\w+|avoid\w*|crisis)\b', conf: 0.9}
      - {re: '\b(clos\w+|block\w*|disrupt\w*|attack\w*|seiz\w+|halt\w*|suspend\w*|shut(s|ting)?|avoid\w*|min(ed|ing))\b.{0,40}\bhormuz\b', conf: 0.9}
  PORT_CLOSURE:
    category: MARITIME
    feature_group: maritime_disruption
    direction: 1
    base_severity: 2
    affected_mode: SEA
    reversible: true
    effects: {capacity: DECREASE, demand: UNKNOWN, supply: DECREASE, diversion_pressure: INCREASE}
    patterns:
      - {re: '\b(ports?|terminals?|harbou?rs?)\b.{0,40}\b(clos(ed|es|ure|ures|ing)|shut(s|down| down)?|suspend(s|ed)? operations|halt(s|ed)? operations|out of action|paralys\w+)\b', conf: 0.85}
      - {re: '\b(clos(e|es|ed|ing|ure of)|shuts?( down)?|shutdown of)\b.{0,25}\b(ports?|terminals?|harbou?rs?)\b', conf: 0.85}
      - {re: '\b(ports?|terminals?|harbou?rs?)\b.{0,30}\b(reopen(s|ed|ing)?|re-open(s|ed|ing)?)\b|\b(reopen(s|ed|ing)?|re-open(s|ed|ing)?)\b.{0,25}\b(ports?|terminals?|harbou?rs?)\b', conf: 0.85}
  PORT_CONGESTION:
    category: MARITIME
    feature_group: maritime_disruption
    direction: 1
    base_severity: 2
    affected_mode: SEA
    reversible: true
    effects: {capacity: DECREASE, demand: UNKNOWN, supply: DECREASE, diversion_pressure: UNKNOWN}
    patterns:
      - {re: '\b(ports?|terminals?|box yards?)\b.{0,40}\b(congest\w+|backlogs?|gridlock\w*|logjam|queues?|bottlenecks?|clogg\w+|chok\w+)\b', conf: 0.85}
      - {re: '\b(congestion|backlogs?|gridlock|logjam|bottlenecks?|queues? of (ships|vessels))\b.{0,40}\b(ports?|terminals?)\b', conf: 0.85}
  SHIPPING_DIVERSION:
    category: MARITIME
    feature_group: maritime_disruption
    direction: 1
    base_severity: 2
    affected_mode: SEA
    reversible: true
    effects: {capacity: DECREASE, demand: UNKNOWN, supply: DECREASE, diversion_pressure: INCREASE}
    patterns:
      - {re: '\b(rerout\w+|re-rout\w+|divert\w+|diversions?)\b.{0,40}\b(ships?|vessels?|carriers?|lines?|liners?|services?|voyages?|sailings?|boxships?|tankers?|cape)\b', conf: 0.85}
      - {re: '\b(ships?|vessels?|carriers?|lines?|liners?|services?|boxships?|tankers?)\b.{0,40}\b(rerout\w+|re-rout\w+|divert\w+)\b', conf: 0.85}
      - {re: '\b(around|round|via) (the )?cape of good hope\b', conf: 0.85}

  # ------------------------------------------------------------------ AVIATION
  AIRSPACE_CLOSURE:
    category: AVIATION
    feature_group: airspace_disruption
    direction: 1
    base_severity: 3
    affected_mode: AIR
    reversible: true
    effects: {capacity: DECREASE, demand: UNKNOWN, supply: DECREASE, diversion_pressure: INCREASE}
    patterns:
      - {re: '\bairspace\b.{0,40}\b(clos(ed|es|ure|ures|ing)|shut(s| down)?|bann?(ed|s)?|sealed)\b', conf: 0.9}
      - {re: '\b(clos(e|es|ed|ing|ure of)|shuts?|bans? .{0,20}from)\b.{0,25}\bairspace\b', conf: 0.9}
      - {re: '\bairspace\b.{0,30}\b(reopen(s|ed|ing)?|re-open(s|ed|ing)?)\b|\b(reopen(s|ed|ing)?|re-open(s|ed|ing)?)\b.{0,25}\bairspace\b', conf: 0.9}
  AIRSPACE_RESTRICTION:
    category: AVIATION
    feature_group: airspace_disruption
    direction: 1
    base_severity: 2
    affected_mode: AIR
    reversible: true
    effects: {capacity: DECREASE, demand: UNKNOWN, supply: DECREASE, diversion_pressure: INCREASE}
    patterns:
      - {re: '\bairspace\b.{0,40}\b(restrict\w+|limit\w+|curbs?|avoid\w*)\b', conf: 0.85}
      - {re: '\b(restrict\w+|avoid\w*|bypass\w*) .{0,25}\bairspace\b', conf: 0.85}
      - {re: '\bno-fly zone\b', conf: 0.8}
      - {re: '\boverflight (ban|bans|restriction|restrictions)\b', conf: 0.85}
  FLIGHT_CANCELLATION:
    category: AVIATION
    feature_group: airspace_disruption
    direction: 1
    base_severity: 2
    affected_mode: AIR
    reversible: true
    effects: {capacity: DECREASE, demand: UNKNOWN, supply: DECREASE, diversion_pressure: UNKNOWN}
    patterns:
      - {re: '\b(flights?|services?|operations?)\b.{0,30}\b(cancel(s|led|ed|lation|lations|ling)?|suspend(s|ed|ing)?|suspension|ground(s|ed|ing)?|halt(s|ed|ing)?|scrapp?(ed|ing)?|axed?)\b', conf: 0.8}
      - {re: '\b(cancel(s|led|ed|ling)?|suspend(s|ed|ing)?|ground(s|ed|ing)?|halt(s|ed|ing)?|axe(s|d)?)\b.{0,30}\b(flights?|(cargo|freighter) (services?|operations?))\b', conf: 0.8}
    requires_mode: AIR
  ROUTE_DIVERSION:
    category: AVIATION
    feature_group: airspace_disruption
    direction: 1
    base_severity: 2
    affected_mode: AIR
    reversible: true
    effects: {capacity: DECREASE, demand: UNKNOWN, supply: DECREASE, diversion_pressure: INCREASE}
    patterns:
      - {re: '\b(flights?|aircraft|freighters?|airlines?)\b.{0,40}\b(rerout\w+|re-rout\w+|divert\w+|longer routes?|detours?)\b', conf: 0.85}
      - {re: '\b(rerout\w+|re-rout\w+|divert\w+)\b.{0,30}\b(flights?|aircraft|freighters?)\b', conf: 0.85}
  AIR_CAPACITY_REDUCTION:
    category: AVIATION
    feature_group: air_capacity_shock
    direction: 1
    base_severity: 2
    affected_mode: AIR
    reversible: false
    requires_mode: AIR
    effects: {capacity: DECREASE, demand: UNKNOWN, supply: DECREASE, diversion_pressure: UNKNOWN}
    patterns:
      - {re: '\b(cuts?|cutting|reduc(e|es|ed|ing)|slash(es|ed|ing)?|trims?|trimm(ed|ing)|withdraw(s|n|ing)?|withdrew|parks?|parked|retir(e|es|ed|ing)|scal(es|ed|ing) back|pull(s|ed)? out)\b.{0,40}\b(freighters?|capacity|frequenc(y|ies)|cargo (flights?|services?|operations?)|fleet)\b', conf: 0.8}
      - {re: '\b(freighters?|capacity|fleet)\b.{0,30}\b(cuts?|reduction|reductions|withdrawn|parked|grounded|retired|removed)\b', conf: 0.75}
      - {re: '\b(ceas(es|ed|ing)|suspends?|suspended|shuts? down|stops?) (all )?(cargo |freighter )?operations\b', conf: 0.8}
  AIR_CAPACITY_ADDITION:
    category: AVIATION
    feature_group: air_capacity_shock
    direction: -1
    base_severity: 1
    affected_mode: AIR
    reversible: false
    requires_mode: AIR
    effects: {capacity: INCREASE, demand: UNKNOWN, supply: INCREASE, diversion_pressure: UNKNOWN}
    patterns:
      - {re: '\b(adds?|added|adding|launch(es|ed|ing)?|introduc(es|ed|ing)|expands?|expanded|expanding|boosts?|boosted|increas(es|ed|ing)|ramps? up|starts?|started|begins?|inaugurat\w+|commenc\w+)\b.{0,50}\b(freighters?( (service|flight|route|operation)s?)?|cargo (flights?|services?|routes?)|capacity|frequenc(y|ies))\b', conf: 0.75}
      - {re: '\b(takes? delivery of|took delivery of|receives?|received|welcomes?|welcomed|orders?|ordered|leases?|leased|acquires?|acquired|converts?)\b.{0,50}\b(freighters?|b7[4-7]7-?\d*f\w*|b767-?\d*\w*f|a3[23]\d-?\d*(p2f|f)\b|atr ?72-?\d*f)\b', conf: 0.8}
      - {re: '\bnew (freighter|cargo) (service|route|flight|link|connection)s?\b', conf: 0.8}

  # ------------------------------------------------------------------ AIR_CARGO
  AIRFREIGHT_RATE_INCREASE:
    category: AIR_CARGO
    excludes: '\b(oil|crude|brent|wti|fuel|kerosene|bunker|share|stock|interest|exchange|inflation|charter|container|box|ocean|sea ?freight|spot ocean|ticket|fare|house|energy|gas|commodity)s?\b.{0,12}\b(rates?|prices?|pricing)\b|\b(fuel|bunker) surcharges?\b'
    feature_group: airfreight_rate_signal
    direction: 1
    base_severity: 2
    affected_mode: AIR
    reversible: false
    requires_mode: AIR
    effects: {capacity: UNKNOWN, demand: UNKNOWN, supply: UNKNOWN, diversion_pressure: UNKNOWN}
    patterns:
      - {re: '\b(rates?|prices?|pricing|yields?)\b.{0,40}\b{UP}\b', conf: 0.8}
      - {re: '\b{UP}\b.{0,25}\b(rates?|prices?|pricing|yields?)\b', conf: 0.7}
      - {re: '\b(rate|price) (hike|hikes|increase|increases|rise|rises|surge|spike)\b', conf: 0.85}
  AIRFREIGHT_RATE_DECREASE:
    category: AIR_CARGO
    excludes: '\b(oil|crude|brent|wti|fuel|kerosene|bunker|share|stock|interest|exchange|inflation|charter|container|box|ocean|sea ?freight|spot ocean|ticket|fare|house|energy|gas|commodity)s?\b.{0,12}\b(rates?|prices?|pricing)\b|\b(fuel|bunker) surcharges?\b'
    feature_group: airfreight_rate_signal
    direction: -1
    base_severity: 2
    affected_mode: AIR
    reversible: false
    requires_mode: AIR
    effects: {capacity: UNKNOWN, demand: UNKNOWN, supply: UNKNOWN, diversion_pressure: UNKNOWN}
    patterns:
      - {re: '\b(rates?|prices?|pricing|yields?)\b.{0,40}\b{DOWN}\b', conf: 0.8}
      - {re: '\b{DOWN}\b.{0,25}\b(rates?|prices?|pricing|yields?)\b', conf: 0.7}
      - {re: '\b(rate|price) (cut|cuts|decline|declines|drop|drops|fall|falls|slump|erosion)\b', conf: 0.85}
  AIR_CARGO_DEMAND_SURGE:
    category: AIR_CARGO
    feature_group: cargo_demand_shock
    direction: 1
    base_severity: 2
    affected_mode: AIR
    reversible: false
    requires_mode: AIR
    effects: {capacity: UNKNOWN, demand: INCREASE, supply: UNKNOWN, diversion_pressure: UNKNOWN}
    patterns:
      - {re: '\b(demand|volumes?|tonnages?|throughput|traffic|ftks?|ctks?|cargo growth)\b.{0,40}\b({UP}|grow(s|ing|th)?|grew|record|boom\w*|strong(er)?|recover\w*|up)\b', conf: 0.8}
      - {re: '\b(record|strong(er)?|surging|soaring|booming|growing|rising|higher|robust)\b.{0,15}\b(demand|volumes?|tonnages?|throughput)\b', conf: 0.75}
